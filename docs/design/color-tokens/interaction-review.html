<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>颜色Token交互与透明度检查</title><link rel="stylesheet" href="colors.css"><style>body{margin:0;padding:24px;background:#e8ebef;font:14px sans-serif}main{display:flex;gap:24px}.panel{width:440px;padding:24px;border-radius:20px;background:var(--color-app-surface-page);color:var(--color-font-primary)}h1{font-size:22px}h2{font-size:18px}.card{padding:20px;border:1px solid var(--color-app-border-subtle);border-radius:16px;background:var(--color-app-surface-card)}p{color:var(--color-font-secondary)}button{position:relative;border:0;border-radius:12px;padding:14px 22px;background:var(--color-comp-background-emphasize);color:var(--color-font-on-primary);font:600 15px sans-serif;cursor:pointer}button:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}button:hover:before{background:var(--color-interactive-hover)}button:active:before{background:var(--color-interactive-pressed)}button:focus-visible{outline:2px solid var(--color-interactive-focus);outline-offset:4px}.option{margin:18px 0;padding:14px;border-radius:12px;background:var(--color-interactive-select);color:var(--color-font-primary)}.secondary{color:var(--color-font-secondary)}.tertiary{color:var(--color-font-tertiary)}.fourth{color:var(--color-font-fourth)}.swatch{height:80px;width:120px;background:var(--color-font-secondary)}code{font-size:12px}label{display:block}</style><h1>小巧记账 · 透明色与交互状态</h1><main><section class="panel" data-theme="light" id="light"><h2>Light</h2><div class="card"><strong>一级文本／原币金额 2,486.00</strong><p class="secondary">二级说明文字：60%黑／白</p><p class="tertiary">三级说明：40%黑／白</p><p class="fourth">四级禁用内容：20%黑／白</p><div class="swatch" id="light-alpha"></div></div><div class="option"><label><input type="checkbox" checked> 含图片的记录 · 选择态</label></div><button id="light-action">焦点／悬停／按压示例</button><p>Tab键显示焦点；悬停/按压分别使用覆盖层，不重复叠加click反馈。</p></section><section class="panel" data-theme="dark" id="dark"><h2>Dark</h2><div class="card"><strong>一级文本／原币金额 2,486.00</strong><p class="secondary">二级说明文字：60%黑／白</p><p class="tertiary">三级说明：40%黑／白</p><p class="fourth">四级禁用内容：20%黑／白</p><div class="swatch" id="dark-alpha"></div></div><div class="option"><label><input type="checkbox" checked> 含图片的记录 · 选择态</label></div><button id="dark-action">焦点／悬停／按压示例</button><p>Tab键显示焦点；悬停/按压分别使用覆盖层，不重复叠加click反馈。</p></section></main></html>
